<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | ComplaintCare</title>
<link rel="stylesheet" href="css/register.css">
</head>
<body>
   <header class="navbar">
        <h2>ComplaintCare</h2>
        <nav>
           <a href="index.html">Home</a>
           <a href="login.html">Login / Register</a>
        </nav>
   </header>
        <main class="auth-container">
           <form class="auth-card" action="register" method="post">
               <h1>Create Account</h1>
                <p>Register to submit and track complaints.</p>
                
                <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name"
                   maxlength="100" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email"
                   maxlength="100" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password"
                   minlength="8" required>
                   
                   <button type="submit" class="btn full-width">
                Register
            </button>

            <p class="form-footer">
                Already registered?
                <a href="login.html">Login here</a>
            </p>
           </form>
        </main>
        <footer>
    &copy; 2026 ComplaintCare. All rights reserved.
            </footer>
</body>
</html>
