<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ComplaintCare</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
     <header class="navbar">
        <h2>ComplaintCare</h2>
         <nav>
             <a href="index.html">Home</a>
             <a href="register.html">Login / Register</a>
            </nav>
       </header>
       
        <main class="auth-container">
           <form class="auth-card" action="LoginServlet" method="post">
             <h1>Welcome Back</h1>
              <p>Sign in to manage your complaints.</p>
              
              <label for="email">Email Address : </label>
              <input type="email" id="email" name="email" placeholder="Enter your email" required>
              
              <label for="password">Password :</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" required>
              
              <button type="submit" class="btn full-width">Login</button>
              
              <p class="form-footer"> Don't have an account? 
                <a href="register.html">Register here</a>
                </p>
           </form>
        </main>
        <footer>
    &copy; 2026 ComplaintCare. All rights reserved.
            </footer>
</body>
</html>
